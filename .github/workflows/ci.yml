# Standalone CI for the public echo-workshop-sdk mirror.
# Zero-dependency by design: every gate below runs on bare Node.js.
name: ECHO Workshop SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: SDK self-check
        run: node bin/echo-workshop-sdk.mjs doctor
      - name: Syntax-check CLI, libraries, templates and examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find bin lib templates examples -type f \( -name '*.mjs' -o -name '*.js' \) -print0)
      - name: Initialize, check and test all eight content kinds
        shell: bash
        run: |
          set -euo pipefail
          for kind in theme lyrics-style visualizer-preset dsp-preset audio-plugin-profile locale-pack plugin-package native-shell; do
            node bin/echo-workshop-sdk.mjs init "$RUNNER_TEMP/sdk-$kind" --kind "$kind" --holder "ECHO SDK"
            if [[ "$kind" == "audio-plugin-profile" ]]; then
              node --input-type=module - "$RUNNER_TEMP/sdk-$kind/content/audio-plugin-profile.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.argv[2];
          const profile = JSON.parse(await readFile(path, 'utf8'));
          profile.plugin = {
            classId: '00112233445566778899AABBCCDDEEFF',
            name: 'CI Fixture Effect',
            vendor: 'ECHO SDK',
          };
          await writeFile(path, `${JSON.stringify(profile, null, 2)}\n`, 'utf8');
          NODE
              node bin/echo-workshop-sdk.mjs sync "$RUNNER_TEMP/sdk-$kind"
            fi
            node bin/echo-workshop-sdk.mjs check "$RUNNER_TEMP/sdk-$kind"
            node bin/echo-workshop-sdk.mjs test "$RUNNER_TEMP/sdk-$kind"
          done
      - name: Validate the bundled complete examples
        shell: bash
        run: |
          set -euo pipefail
          for example in hello-plugin minimal-theme stylesheet-theme retro-modern-ui-runtime lyrics-view-runtime lyrics-cinema-scene visualizer-radial dsp-vocal locale-wenyan native-shell-taskbar; do
            cp -R "examples/$example" "$RUNNER_TEMP/example-$example"
            node bin/echo-workshop-sdk.mjs validate "$RUNNER_TEMP/example-$example"
            node bin/echo-workshop-sdk.mjs test "$RUNNER_TEMP/example-$example"
          done

  types:
    name: Strict TypeScript declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compile the public declarations under strict mode
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.9.3
          cat > tsconfig.types-check.json <<'JSON'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "types": []
            },
            "files": ["echo-workshop-plugin.d.ts", "echo-workshop-ui-runtime.d.ts"]
          }
          JSON
          npx tsc --project tsconfig.types-check.json --pretty false
